name: Build and Push to K8s

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Determine environment from tag
        id: env
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == *-dev ]]; then
            echo "overlay=development" >> "$GITHUB_OUTPUT"
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          else
            echo "overlay=production" >> "$GITHUB_OUTPUT"
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Verify package.json version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          TAG="${TAG%%-*}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check + Lint
        run: npm run typecheck & npm run lint & wait

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build application
        run: npm run build

      - name: Build and Push Docker image
        uses: ./.github/actions/build-and-push-quay
        with:
          image-name: ${{ github.event.repository.name }}
          version: ${{ steps.env.outputs.tag }}
          registry-username: ${{ secrets.QUAY_USERNAME }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}

      - name: Update CI/CD repo kustomize image tag
        uses: ./.github/actions/update-ci-cd
        with:
          argo-project-name: taostats-${{ github.event.repository.name }}
          kustomize-path: overlays/${{ steps.env.outputs.overlay }}
          image-name: ${{ github.event.repository.name }}
          version: ${{ steps.env.outputs.tag }}
          token: ${{ secrets.GH_PAT }}

      - name: Update testnet overlay (same image as production)
        if: steps.env.outputs.is_prod == 'true'
        uses: ./.github/actions/update-ci-cd
        with:
          argo-project-name: taostats-${{ github.event.repository.name }}
          kustomize-path: overlays/testnet
          image-name: ${{ github.event.repository.name }}
          version: ${{ steps.env.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
