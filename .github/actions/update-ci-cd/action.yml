name: Update CI/CD
description: Update image tag in ci-cd-repo kustomization

inputs:
  argo-project-name:
    description: Folder name in ci-cd-repo for this app
    required: true
  kustomize-path:
    description: Overlay path inside the project (e.g. overlays/production)
    required: true
  image-name:
    description: Image name to set in kustomization
    required: true
  version:
    description: New image tag (typically commit SHA)
    required: true
  registry-url:
    description: Container registry URL
    required: false
    default: quay.io/taostats
  token:
    description: GitHub token with push access to ci-cd-repo
    required: true

runs:
  using: composite
  steps:
    - name: Checkout ci-cd-repo
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        repository: taostat/ci-cd-repo
        token: ${{ inputs.token }}
        path: ci-cd-repo

    - name: Install kustomize
      shell: bash
      run: |
        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" -o kustomize.tar.gz
        tar xzf kustomize.tar.gz kustomize
        mv kustomize /usr/local/bin/kustomize
        rm kustomize.tar.gz

    - name: Update image tag
      shell: bash
      run: |
        cd "ci-cd-repo/${{ inputs.argo-project-name }}/${{ inputs.kustomize-path }}"
        kustomize edit set image ${{ inputs.image-name }}=${{ inputs.registry-url }}/${{ inputs.image-name }}:${{ inputs.version }}
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add kustomization.yaml
        git commit -m "Update ${{ inputs.image-name }} image to ${{ inputs.version }}" || echo "No changes to commit"
        git push
